<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RepoForge AI - Gold Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .mono { font-family: 'JetBrains+Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/javascript">
        const { useState, useEffect, useRef } = React;
        const { 
            Github, Sparkles, Settings, Cpu, Download, Upload, FileCode, 
            FileJson, BookOpen, Globe, Eye, Code2, AlertCircle, Send, 
            Wand2, X, FileArchive, Zap, Terminal, Layers
        } = lucide;

        const TEMPLATES = [
            { title: "Task Manager", icon: "CheckCircle", prompt: "A productivity task manager with categories, progress bars, and local storage persistence. Use a clean emerald theme." },
            { title: "Calorie Tracker", icon: "Flame", prompt: "A fitness calorie tracker where users can log meals and see a daily total gauge. Use a vibrant orange and dark mode theme." },
            { title: "Weather PWA", icon: "Cloud", prompt: "A weather dashboard using a public API. Needs a glassmorphism design and auto-updating background based on weather." },
            { title: "Portfolio", icon: "User", prompt: "A sleek one-page portfolio for a developer with a bento-grid layout for projects and a contact form." },
            { title: "Finance Bot", icon: "DollarSign", prompt: "An expense tracker that uses a script.gs to potentially handle data logging. Professional navy blue interface." }
        ];

        const App = () => {
            const [ghToken, setGhToken] = useState(localStorage.getItem('gh_token') || '');
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('gemini_key') || '');
            const [repoName, setRepoName] = useState('');
            const [prompt, setPrompt] = useState('');
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('html');
            const [status, setStatus] = useState({ type: '', message: '' });
            const [loading, setLoading] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [isPreviewOpen, setIsPreviewOpen] = useState(false);
            const [showAiPanel, setShowAiPanel] = useState(false);

            const [files, setFiles] = useState({
                html: { content: '<!DOCTYPE html>\n<html>\n<body class="p-10">\n <h1 class="text-2xl font-bold">Forge Ready</h1>\n</body>\n</html>', sha: null },
                react: { content: '// app.js\nconsole.log("Logic loaded");', sha: null },
                manifest: { content: '{\n "name": "New App",\n "display": "standalone"\n}', sha: null },
                sw: { content: '// sw.js\nself.addEventListener("fetch", (e) => {});', sha: null },
                readme: { content: '# My Project', sha: null },
                script: { content: '// script.gs\nfunction doGet() {\n  return ContentService.createTextOutput("Hello from Apps Script");\n}', sha: null }
            });

            const fileMap = {
                html: 'index.html',
                react: 'app.js',
                manifest: 'manifest.json',
                sw: 'sw.js',
                readme: 'README.md',
                script: 'script.gs'
            };

            useEffect(() => {
                if (ghToken) { localStorage.setItem('gh_token', ghToken); fetchGithubUser(); }
            }, [ghToken]);

            useEffect(() => {
                if (geminiKey) localStorage.setItem('gemini_key', geminiKey);
            }, [geminiKey]);

            const showStatus = (type, message) => {
                setStatus({ type, message });
                setTimeout(() => setStatus({ type: '', message: '' }), 6000);
            };

            const fetchGithubUser = async () => {
                if (!ghToken) return;
                try {
                    const res = await fetch('https://api.github.com/user', {
                        headers: { Authorization: `token ${ghToken}` }
                    });
                    if (res.ok) setUser(await res.json());
                } catch (e) { showStatus('error', 'GitHub link failed'); }
            };

            const generateWithGemini = async () => {
                if (!geminiKey || !prompt) return showStatus('error', 'Need API Key and Prompt');
                setAiLoading(true);
                showStatus('info', 'Gemini 2.5 Flash is forging...');

                const systemPrompt = `You are a PWA & Google Apps Script expert. Generate a full app. 
                Return a JSON object with keys: html, react (logic), manifest, sw, readme, script (Apps Script .gs code).
                Style the HTML using Tailwind CSS for a premium mobile experience.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiKey}`, {
                        method: 'POST',
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Task: ${prompt}` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: {
                                    type: "OBJECT",
                                    properties: {
                                        html: { type: "STRING" },
                                        react: { type: "STRING" },
                                        manifest: { type: "STRING" },
                                        sw: { type: "STRING" },
                                        readme: { type: "STRING" },
                                        script: { type: "STRING" }
                                    }
                                }
                            }
                        })
                    });
                    
                    const result = await response.json();
                    const data = JSON.parse(result.candidates[0].content.parts[0].text);
                    
                    setFiles({
                        html: { content: data.html, sha: files.html.sha },
                        react: { content: data.react, sha: files.react.sha },
                        manifest: { content: data.manifest, sha: files.manifest.sha },
                        sw: { content: data.sw, sha: files.sw.sha },
                        readme: { content: data.readme, sha: files.readme.sha },
                        script: { content: data.script, sha: files.script.sha }
                    });
                    
                    showStatus('success', 'AI Generation Finished!');
                    setShowAiPanel(false);
                } catch (err) {
                    showStatus('error', 'Generation Error');
                } finally { setAiLoading(false); }
            };

            const downloadZip = async () => {
                if (!repoName) return showStatus('error', 'Enter repo name first');
                try {
                    const zip = new JSZip();
                    Object.entries(fileMap).forEach(([key, filename]) => {
                        zip.file(filename, files[key].content);
                    });
                    const blob = await zip.generateAsync({ type: "blob" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${repoName}.zip`;
                    a.click();
                    showStatus('success', 'ZIP downloaded to Honor X6b');
                } catch (e) { showStatus('error', 'Zip creation failed'); }
            };

            const handleDeploy = async () => {
                if (!repoName || !ghToken || !user) return showStatus('error', 'Setup incomplete');
                setLoading(true);
                showStatus('info', 'Pushing to GitHub...');

                try {
                    // Create repo if missing
                    await fetch('https://api.github.com/user/repos', {
                        method: 'POST',
                        headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: repoName, auto_init: false })
                    });

                    // Push files with delay
                    for (const [key, filename] of Object.entries(fileMap)) {
                        const body = {
                            message: `Forge Update: ${filename}`,
                            content: btoa(unescape(encodeURIComponent(files[key].content))),
                        };
                        if (files[key].sha) body.sha = files[key].sha;

                        const res = await fetch(`https://api.github.com/repos/${user.login}/${repoName}/contents/${filename}`, {
                            method: 'PUT',
                            headers: { Authorization: `token ${ghToken}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });

                        if (res.ok) {
                            const d = await res.json();
                            setFiles(p => ({ ...p, [key]: { ...p[key], sha: d.content.sha } }));
                        }
                        await new Promise(r => setTimeout(r, 600));
                    }

                    showStatus('success', 'Repository Synced!');
                } catch (e) { showStatus('error', 'GitHub Error'); }
                finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen pb-44">
                    {/* Header */}
                    <header className="px-6 py-6 glass border-b sticky top-0 z-50 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-100">
                                <Zap className="text-white" size={24} />
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold tracking-tighter">REPORFORGE <span className="text-indigo-600">GOLD</span></h1>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Optimized for Honor X6b</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => setShowAiPanel(!showAiPanel)}
                            className={`w-12 h-12 rounded-2xl transition-all flex items-center justify-center ${showAiPanel ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                        >
                            <Sparkles size={20} />
                        </button>
                    </header>

                    {/* Quick Forge Templates */}
                    <div className="px-6 py-4 overflow-x-auto no-scrollbar flex gap-3 bg-white border-b">
                        {TEMPLATES.map((t, i) => (
                            <button 
                                key={i}
                                onClick={() => { setPrompt(t.prompt); setShowAiPanel(true); }}
                                className="px-4 py-3 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center gap-2 whitespace-nowrap active:scale-95 transition-all"
                            >
                                <Sparkles size={14} className="text-indigo-600" />
                                <span className="text-xs font-bold text-indigo-900">{t.title}</span>
                            </button>
                        ))}
                    </div>

                    <main className="p-4 space-y-4 max-w-lg mx-auto">
                        {/* Auth & Repo Config */}
                        <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border space-y-4">
                            <div className="relative">
                                <Settings className="absolute left-4 top-4 text-slate-400" size={18} />
                                <input 
                                    type="password" placeholder="GitHub Token" value={ghToken} onChange={e => setGhToken(e.target.value)}
                                    className="w-full bg-slate-50 p-4 pl-12 rounded-2xl text-xs font-mono outline-none"
                                />
                            </div>
                            <div className="flex gap-2">
                                <input 
                                    type="text" placeholder="Repo Name" value={repoName} onChange={e => setRepoName(e.target.value)}
                                    className="flex-1 bg-slate-50 p-4 rounded-2xl font-bold outline-none"
                                />
                                <button onClick={downloadZip} className="bg-slate-100 p-4 rounded-2xl text-slate-500 active:scale-90 transition-all">
                                    <FileArchive size={20} />
                                </button>
                            </div>
                        </div>

                        {/* AI Generator Panel */}
                        {showAiPanel && (
                            <div className="bg-slate-900 p-6 rounded-[2.5rem] shadow-2xl text-white space-y-4 animate-in">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2 font-black uppercase tracking-widest text-sm text-indigo-400">
                                        <Cpu size={18} /> AI Workbench
                                    </div>
                                    <button onClick={() => setShowAiPanel(false)}><X size={20} /></button>
                                </div>
                                <input 
                                    type="password" placeholder="Gemini API Key" value={geminiKey} onChange={e => setGeminiKey(e.target.value)}
                                    className="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-xs outline-none"
                                />
                                <textarea 
                                    placeholder="Describe your PWA..." value={prompt} onChange={e => setPrompt(e.target.value)}
                                    className="w-full bg-white text-slate-900 p-5 rounded-2xl font-bold h-32 outline-none"
                                />
                                <button 
                                    onClick={generateWithGemini} disabled={aiLoading}
                                    className="w-full bg-indigo-600 py-5 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all"
                                >
                                    {aiLoading ? <RefreshCw className="animate-spin" size={18} /> : <><Wand2 size={18} /> Generate Code</>}
                                </button>
                            </div>
                        )}

                        {/* Editor Tabs */}
                        <div className="bg-white rounded-[3rem] overflow-hidden border shadow-sm">
                            <div className="flex p-2 bg-slate-50 border-b overflow-x-auto no-scrollbar gap-1">
                                {Object.keys(fileMap).map(tab => (
                                    <button
                                        key={tab} onClick={() => { setActiveTab(tab); setIsPreviewOpen(false); }}
                                        className={`px-5 py-3 rounded-2xl font-black text-[10px] uppercase transition-all whitespace-nowrap ${activeTab === tab && !isPreviewOpen ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400'}`}
                                    >
                                        {tab === 'react' ? 'Logic' : tab === 'script' ? 'AppScript' : tab}
                                    </button>
                                ))}
                            </div>
                            <div className="relative">
                                {isPreviewOpen ? (
                                    <iframe srcDoc={files.html.content + '<script>' + files.react.content + '<\/script>'} className="w-full h-[450px]" title="Preview" />
                                ) : (
                                    <div className="bg-slate-950 p-4">
                                        <textarea
                                            value={files[activeTab].content}
                                            onChange={e => setFiles({...files, [activeTab]: {...files[activeTab], content: e.target.value}})}
                                            className="w-full h-[450px] bg-transparent text-indigo-300 font-mono text-xs outline-none resize-none leading-relaxed"
                                            spellCheck="false"
                                        />
                                    </div>
                                )}
                                <button 
                                    onClick={() => setIsPreviewOpen(!isPreviewOpen)}
                                    className={`absolute bottom-6 right-6 p-4 rounded-2xl shadow-xl flex items-center gap-2 z-10 ${isPreviewOpen ? 'bg-rose-500 text-white' : 'bg-white text-slate-900 border'}`}
                                >
                                    {isPreviewOpen ? <Code2 size={24} /> : <Eye size={24} />}
                                    <span className="text-[10px] font-black uppercase tracking-widest">{isPreviewOpen ? 'Edit' : 'Preview'}</span>
                                </button>
                            </div>
                        </div>

                        {status.message && (
                            <div className={`p-5 rounded-3xl flex items-center gap-3 border-2 animate-bounce ${status.type === 'error' ? 'bg-rose-50 border-rose-100 text-rose-600' : 'bg-indigo-50 border-indigo-100 text-indigo-600'}`}>
                                <AlertCircle size={20} />
                                <span className="text-xs font-black uppercase tracking-tight">{status.message}</span>
                            </div>
                        )}
                    </main>

                    {/* Footer Controls */}
                    <footer className="fixed bottom-0 left-0 right-0 p-6 glass border-t z-50 flex gap-4">
                        {repoName && (
                            <a href={`https://${user?.login}.github.io/${repoName}`} target="_blank" className="w-16 h-16 bg-white border rounded-2xl flex flex-col items-center justify-center active:scale-90 transition-all">
                                <Globe size={24} className="text-slate-400" />
                                <span className="text-[7px] font-black uppercase mt-1">Live</span>
                            </a>
                        )}
                        <button 
                            onClick={handleDeploy} disabled={loading || !repoName}
                            className="flex-1 bg-indigo-600 h-16 text-white rounded-2xl font-black uppercase tracking-[0.2em] shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3 disabled:bg-slate-300"
                        >
                            {loading ? <RefreshCw className="animate-spin" /> : <><Upload size={24} /> Sync GitHub</>}
                        </button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
